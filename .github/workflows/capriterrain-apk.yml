name: CapriTerrain GPS - APK Android
on:
  push:
    branches: [capriterrain-apk-build]
    paths:
      - 'capriterrain/**'
      - '.github/workflows/capriterrain-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: capriterrain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer SDK Android 35 depuis l'environnement GitHub
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compiler l'APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Publier l'APK compilé
        uses: actions/upload-artifact@v4
        with:
          name: CapriTerrain-GPS-APK
          path: capriterrain/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
