plugins { id 'com.android.application' }
android {
    namespace 'tg.capriterrain.gps'
    compileSdk 35
    defaultConfig {
        applicationId 'tg.capriterrain.gps'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    buildTypes {
        release { minifyEnabled false }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
